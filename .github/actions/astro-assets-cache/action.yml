name: Astro assets cache
description: Reuse optimized images between builds; they are the bulk of build time

inputs:
  working-directory:
    description: Project directory
    default: .

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.working-directory }}/node_modules/.astro/assets
        key: astro-assets-${{ runner.arch }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/src/content/posts/**/*.png', inputs.working-directory), format('{0}/src/content/posts/**/*.jp*g', inputs.working-directory), format('{0}/src/content/posts/**/*.gif', inputs.working-directory), format('{0}/src/content/posts/**/*.webp', inputs.working-directory)) }}
        restore-keys: astro-assets-${{ runner.arch }}-${{ inputs.working-directory }}-
