name: External links

# Posts link to thousands of outside pages that move or die over time. Not a merge gate (other sites'
# uptime is not ours); a weekly report issue instead.
on:
  schedule:
    - cron: '0 0 * * 1' # Monday 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403/418/429: sites that block bots or rate-limit, not dead links (418 is Naver's bot block).
          # Root-relative post links and post-folder images only resolve against the site, and
          # scripts/check-dist.ts already checks them in the built site, so resolve them there and skip them.
          # Loopback: posts show local dev-server addresses as examples, never reachable from CI.
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --exclude-loopback
            --accept '200..=299,403,418,429'
            --base-url https://perfectacle.github.io
            --exclude '^https://perfectacle\.github\.io/'
            'src/content/posts/**/*.md'
          output: lychee-report.md
          format: markdown
          fail: false

      - name: Open or update the report issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 깨진 외부 링크 리포트
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Issue bodies cap at 65536 characters; the full report stays in the run summary.
          limit=60000
          if [ "$(wc -c < lychee-report.md)" -gt "$limit" ]; then
            head -c "$limit" lychee-report.md | sed '$d' > report-head.md
            printf '\n…(이하 생략) 전체 리포트: %s\n' "$RUN_URL" >> report-head.md
            mv report-head.md lychee-report.md
          fi
          number=$(gh issue list --state open --label broken-links --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file lychee-report.md
          else
            gh label create broken-links --color B60205 --force
            gh issue create --title "$TITLE" --label broken-links --body-file lychee-report.md
          fi

      - name: Close the report issue when everything resolves
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --label broken-links --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue close "$number" --comment "이번 점검에서 깨진 링크가 없습니다."; fi
