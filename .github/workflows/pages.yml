name: Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs are superseded by newer pushes; master deploys always run to completion.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dependency PRs auto-merge on green, so they also have to prove the rendered site did not change.
  IS_BOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' }}

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [lint, format:check, check, typecheck, test, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - run: pnpm run ${{ matrix.task }}

  actionlint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/astro-assets-cache

      - run: pnpm build

      - run: pnpm verify:urls

      - run: pnpm verify:dist

      - if: env.IS_BOT_PR == 'true'
        run: node scripts/snapshot-output.ts dist head-snapshot.json

      - if: env.IS_BOT_PR == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: head-snapshot
          path: head-snapshot.json
          retention-days: 3

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/astro-assets-cache

      # Rebuilding here (images cached) is faster than shipping the ~450MB dist between jobs.
      - run: pnpm build

      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  output-baseline:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      # The PR's own scripts snapshot the base build, so both sides are normalized the same way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: ./.github/actions/setup
        with:
          working-directory: base

      - uses: ./.github/actions/astro-assets-cache
        with:
          working-directory: base

      - working-directory: base
        run: pnpm build

      - run: node scripts/snapshot-output.ts base/dist base-snapshot.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-snapshot
          path: base-snapshot.json
          retention-days: 3

  output-diff:
    needs: [build, output-baseline]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            .node-version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-snapshot'
          merge-multiple: true

      - run: node scripts/compare-output.ts base-snapshot.json head-snapshot.json

  # The one required status check on master: passes only when every job above passed or was skipped by design.
  ci-ok:
    if: always()
    needs: [verify, actionlint, build, e2e, output-baseline, output-diff]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok

  deploy:
    if: github.event_name != 'pull_request'
    needs: ci-ok
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
