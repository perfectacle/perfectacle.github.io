<text x="247.5" y="342" font-size="12" text-anchor="middle" fill="#334155">높이 11</text>
<text x="309.0" y="304" font-size="12" fill="#334155">앞 2바이트 0x9205: 아래 12비트 = 글자 수 0x205, 위 4비트 = 폭</text>
<text x="309.0" y="324" font-size="12" fill="#334155">다음 2바이트: 뱅크 $1F 안에서 이 그룹 글자 데이터가 시작하는 곳</text>
<text x="309.0" y="344" font-size="12" fill="#334155">마지막 바이트 0x2C: 2비트 오른쪽으로 밀면 높이</text>
<text x="309.0" y="364" font-size="12" fill="#334155">그룹의 n번째 글자는 시작점에서 n × 폭 × 높이 비트 뒤</text>
