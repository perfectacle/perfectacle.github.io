<text x="110" y="202" font-size="12" fill="#475569">쓰지 않는 코드를 이웃 그룹과 같은 크기의 빈 글자로 바꿔 45칸으로 합치고, 새 글자 3칸을 더했습니다. 10칸이 남습니다.</text>
<rect x="110" y="226" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/>
