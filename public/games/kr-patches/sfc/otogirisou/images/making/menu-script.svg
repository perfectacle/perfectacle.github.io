<text x="46" y="342" font-size="13" fill="#e5e7eb" font-family="ui-monospace,Menlo,monospace">{25} 어디부터 다시 읽을까요 {00}</text>
<text x="46" y="370" font-size="13" fill="#e5e7eb" font-family="ui-monospace,Menlo,monospace">{1A:보기 4개} {03:@1} 제3장 수조가 있는 홀 {1C} {03:@2} 지금까지 읽은 모든 장 {1C} …</text>
<text x="46" y="398" font-size="13" fill="#e5e7eb" font-family="ui-monospace,Menlo,monospace">@1: {44:3} {17:5}{25} {2E:장면} {3B:음악 끄기}{3A:20,음악 켜기} {03:제3장 시작}</text>
