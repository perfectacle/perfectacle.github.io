<text x="830" y="150" font-size="12" fill="#64748b" text-anchor="end" font-family="ui-monospace,Menlo,monospace">$2FF</text>
<text x="30" y="190" font-size="14" fill="#1e3a8a">v1.0: 여기 224칸이 꽉 찼다 (한글 165자 + 영숫자·기호·아이콘)</text>
<text x="30" y="215" font-size="14" fill="#92400e">v1.1: 메뉴 화면에서 안 쓰는 노란 칸을 128칸짜리 「임시 글자 칸」으로 쓴다</text>
