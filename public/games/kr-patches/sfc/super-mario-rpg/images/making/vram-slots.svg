<rect x="563" y="70" width="267" height="60" fill="#fde68a" stroke="#d97706"/>
<text x="297" y="96" font-size="15" text-anchor="middle" fill="#111">타일 $000–$1FF · 메뉴 폰트 256글자 (글자당 2장)</text>
<text x="297" y="118" font-size="13" text-anchor="middle" fill="#333">메뉴를 여는 동안 항상 여기 있다 = 코드 1바이트로 고르는 글자</text>
