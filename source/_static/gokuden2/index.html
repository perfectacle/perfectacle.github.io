<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초오공전 각성편 한글패치</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="stage" data-scene="start">
  <div id="screen">
    <canvas id="cv" width="256" height="239"></canvas>
    <div id="titlecard">
      <img id="logo" src="assets/logo.png" alt="DRAGON BALL Z 초오공전 각성편">
      <p id="subtitle"></p>
      <div id="menu" hidden>
        <button type="button" data-go="patch">패치 내용 보기</button>
        <button type="button" data-go="play">게임 플레이</button>
      </div>
    </div>
    <div id="komenu" hidden>
      <p id="kotitle"></p>
      <button type="button" data-go="retry">다시 하기</button>
      <button type="button" data-go="title">타이틀로</button>
    </div>
    <button id="start" type="button">
      <span class="blink">PUSH START</span>
      <small>클릭 또는 Enter · 소리가 나옵니다</small>
    </button>
  </div>

  <section id="patchview" hidden>
    <div class="cmp">
      <figure>
        <figcaption>v1.1</figcaption>
        <div class="pscr"><video id="v11" muted playsinline preload="auto"></video><img id="i11" alt="" hidden><canvas id="h11" width="256" height="239"></canvas><p class="lack" hidden>(v1.1에 없던 대사)</p></div>
      </figure>
      <figure>
        <figcaption>v1.2</figcaption>
        <div class="pscr"><video id="v12" muted playsinline preload="auto"></video><img id="i12" alt="" hidden><canvas id="h12" width="256" height="239"></canvas><p class="lack" hidden></p></div>
      </figure>
    </div>
    <div class="prow">
      <canvas id="shen" width="340" height="96"></canvas>
      <div class="pctl">
        <button id="pnext" type="button">다음 ▶</button>
        <button id="pfast" type="button">2배속</button>
        <button id="pback" type="button">타이틀로</button>
      </div>
    </div>
  </section>

  <div id="bar">
    <p id="why" hidden></p>
    <p id="hint"></p>
    <p id="fhp" hidden></p>
    <div id="controller" hidden>
      <svg id="pad" viewBox="0 -14 520 252" aria-label="슈퍼 패미컴 컨트롤러">
        <rect class="shoulder" data-btn="l" x="40" y="6" width="130" height="34" rx="16"/>
        <rect class="shoulder" data-btn="r" x="350" y="6" width="130" height="34" rx="16"/>
        <title>L+R 기 모으기 (키보드 Q+W)</title>
        <text x="105" y="29" class="sl">L</text><text x="415" y="29" class="sl">R</text>
        <path class="body" d="M110 26 H410 A100 100 0 0 1 410 214 H110 A100 100 0 0 1 110 26 Z"/>
        <g class="dpad">
          <rect x="92" y="78" width="36" height="104" rx="5"/>
          <rect x="58" y="112" width="104" height="36" rx="5"/>
          <rect class="dhit" data-dir="up" x="92" y="78" width="36" height="34"/>
          <rect class="dhit" data-dir="down" x="92" y="148" width="36" height="34"/>
          <rect class="dhit" data-dir="left" x="58" y="112" width="34" height="36"/>
          <rect class="dhit" data-dir="right" x="128" y="112" width="34" height="36"/>
        </g>
        <rect class="pill" x="200" y="124" width="42" height="14" rx="7" transform="rotate(-25 221 131)"/>
        <rect class="pill" x="262" y="124" width="42" height="14" rx="7" transform="rotate(-25 283 131)"/>
        <text x="206" y="166" class="pl">SELECT</text><text x="270" y="166" class="pl">START</text>
        <g class="face" data-btn="x"><circle cx="410" cy="72" r="24" fill="#3f6fe0"/><text x="410" y="80">X</text></g>
        <g class="face" data-btn="a"><circle cx="458" cy="120" r="24" fill="#e04848"/><text x="458" y="128">A</text></g>
        <g class="face" data-btn="b"><circle cx="410" cy="168" r="24" fill="#f2c83b"/><text x="410" y="176" class="dark">B</text></g>
        <g class="face" data-btn="y"><circle cx="362" cy="120" r="24" fill="#3fb84a"/><text x="362" y="128">Y</text></g>
      </svg>
      <ul id="moves">
        <li data-move="a"><kbd class="a">A</kbd><b>유도기공탄</b><small>기공</small></li>
        <li data-move="b"><kbd class="b">B</kbd><b>잔상권</b><small>스피드</small></li>
        <li data-move="x"><kbd class="x">X</kbd><b>전력투구</b><small>파워</small></li>
        <li data-move="y"><kbd class="y">Y</kbd><b>카운터</b><small>반격</small></li>
        <li data-move="ax"><kbd class="a">A</kbd>+<kbd class="x">X</kbd><b>에네르기파</b></li>
        <li data-move="by"><kbd class="b">B</kbd>+<kbd class="y">Y</kbd><b>태양권</b></li>
      </ul>
      <p id="fancy">방향키(↑→←↓) + 버튼 = 후반 기술<br>예) ↑X 거북선인류최종오의 · →X 메테오 스매쉬 · ↑A 초기공포 · ↑B 파이널 어택</p>
    </div>
  </div>
  <div id="sys">
    <button id="skip" type="button">SKIP ▶▶</button>
    <button id="mute" type="button">소리 ON</button>
  </div>
</main>

<script src="main.js"></script>
</body>
</html>
